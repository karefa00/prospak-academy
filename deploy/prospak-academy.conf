# Ubuntu Apache example. Replace the pathname and hostname for your actual server.
<VirtualHost *:80>
    ServerName prospak.test
    DocumentRoot /var/www/prospak-academy/public
    <Directory /var/www/prospak-academy/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/prospak-academy-error.log
    CustomLog ${APACHE_LOG_DIR}/prospak-academy-access.log combined
</VirtualHost>
